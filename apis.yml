aid: clark
name: Clark
description: >-
  Clark ("Dein Versicherungsmanager") is a Germany-based digital insurance manager that lets
  consumers view, compare, optimize, and manage all of their insurance policies in one mobile app
  and web platform. Founded in Frankfurt in 2015, Clark pairs a licensed insurance brokerage with
  automated tariff comparison across more than 180 insurance providers and free expert
  consultation, covering health, liability, property, life, mobility, and retirement products. The
  company operates across Germany, Switzerland, France, and the UK, serves over 700,000 customers,
  and is backed by venture investors including Lightspeed Venture Partners. Clark exposes no public
  developer API or developer portal; it is a consumer-facing insurtech rather than an API producer.
